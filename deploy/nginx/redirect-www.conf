# Redirección 301 de www.capgrupo.com a capgrupo.com.
# Va como un bloque `server` aparte, no dentro del de capgrupo.com.
# Los certificados deben cubrir también www.capgrupo.com (hoy responde por HTTPS, así que ya debería).
#
# Ajustar las rutas de certificado a las reales del servidor.

server {
    listen 80;
    listen [::]:80;
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.capgrupo.com;

    ssl_certificate     /ruta/al/fullchain.pem;    # ajustar
    ssl_certificate_key /ruta/a/privkey.pem;       # ajustar

    # Permanente y conservando la ruta y la query string.
    return 301 https://capgrupo.com$request_uri;
}
