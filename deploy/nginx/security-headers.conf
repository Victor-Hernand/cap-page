# Cabeceras de seguridad para capgrupo.com.
# Incluir dentro del bloque `server { ... }` del dominio, con:  include /ruta/a/security-headers.conf;
#
# Nota: en nginx, `add_header` de un bloque `location` anula los del `server`. Si algún `location`
# define sus propios add_header, repítalos ahí o use la directiva `more_set_headers` (módulo headers-more).

# HSTS: solo HTTPS. Sin includeSubDomains a propósito: recruit.capgrupo.com debe confirmarse con HTTPS antes.
add_header Strict-Transport-Security "max-age=31536000" always;

# Evita que el navegador adivine el tipo MIME de un archivo.
add_header X-Content-Type-Options "nosniff" always;

# Sin referer completo hacia otros sitios; el origen basta para enlaces externos.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Desactiva funciones del navegador que el sitio no usa.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;

# Nadie puede embeber el sitio en un iframe (anti clickjacking).
add_header X-Frame-Options "DENY" always;

# CSP: el sitio no usa scripts en línea ni orígenes externos (fuentes y assets son propios).
# 'unsafe-inline' en style-src es necesario porque React aplica estilos en atributos style="".
# form-action permite solo el propio sitio; los enlaces a recruit.capgrupo.com son navegación, no formularios embebidos.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src 'none'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'" always;
