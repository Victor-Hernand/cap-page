# Caché para capgrupo.com.
# Incluir dentro del bloque `server { ... }`, con:  include /ruta/a/cache.conf;
#
# Los archivos de /assets llevan hash en el nombre (index-<hash>.js), así que pueden cachearse un año.
# El HTML no se cachea: apunta a los assets nuevos después de cada despliegue.
#
# Importante: `add_header` dentro de un `location` anula las cabeceras de seguridad del `server`.
# Por eso cada `location` que define Cache-Control vuelve a incluir security-headers.conf.

location ^~ /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    include /ruta/a/security-headers.conf;   # ajustar la ruta real del archivo
    try_files $uri =404;
}
