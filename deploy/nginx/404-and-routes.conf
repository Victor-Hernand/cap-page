# Rutas y respuestas 404 para capgrupo.com.
# Incluir dentro del bloque `server { ... }`, con:  include /ruta/a/404-and-routes.conf;
#
# Todas las rutas válidas se prerenderizan en el build (dist/<ruta>/index.html), así que no hace falta
# un fallback a index.html: cualquier ruta que no exista responde 404 real con dist/404.html (noindex).

# Estas dos rutas ya no son válidas: /login redirigía en JavaScript al inicio de empresas.
location = /login {
    return 301 /#empresas;
}

# Archivo que no existe -> 404 real con la página propia (sin canonical y con noindex).
error_page 404 /404.html;
location = /404.html {
    internal;
}

location / {
    # Archivo o carpeta con index.html (rutas prerenderizadas), o 404.
    try_files $uri $uri/ =404;
    # HTML sin caché: apunta a los assets con hash de cada despliegue.
    add_header Cache-Control "no-cache" always;
    include /ruta/a/security-headers.conf;   # ajustar la ruta real; add_header aquí anula las del server
}
