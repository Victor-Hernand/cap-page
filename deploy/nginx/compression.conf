# Compresión Brotli (con gzip de respaldo) para capgrupo.com.
# Incluir dentro del bloque `server { ... }`, con:  include /ruta/a/compression.conf;
#
# Requiere el módulo Brotli de nginx (no viene en el paquete base de nginx en Ubuntu):
#   sudo apt install libnginx-mod-http-brotli-filter libnginx-mod-http-brotli-static
# Y, en el bloque principal de /etc/nginx/nginx.conf (antes de `events {`):
#   load_module modules/ngx_http_brotli_filter_module.so;
#   load_module modules/ngx_http_brotli_static_module.so;
#
# Medido en el build (dist/assets): el JS pasa de 102 KB con gzip a unos 88 KB con Brotli (calidad 11).

brotli on;
brotli_comp_level 6;
brotli_static on;   # sirve archivo.js.br si existe; no hace falta si no se precomprimen los archivos
brotli_types text/plain text/css text/javascript application/javascript application/json application/manifest+json application/xml image/svg+xml;

# gzip queda como respaldo para navegadores que no piden br.
gzip on;
gzip_comp_level 5;
gzip_vary on;
gzip_types text/plain text/css text/javascript application/javascript application/json application/manifest+json application/xml image/svg+xml;
